name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dcb, POSTGRES_PASSWORD: dcb, POSTGRES_DB: dcb }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dcb" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Types
        run: mypy app
      - name: ORM schema gate
        run: python -m app.db.check_models
      - name: Migration matches models gate
        run: python -m app.db.check_migration
      - name: Apply migration to Postgres
        env: { DATABASE_URL: "postgresql+psycopg://dcb:dcb@localhost:5432/dcb" }
        run: |
          python - <<'PY'
          from alembic.config import Config; from alembic import command
          import os
          cfg = Config("alembic.ini"); cfg.set_main_option("sqlalchemy.url", os.environ["DATABASE_URL"])
          command.upgrade(cfg, "head")
          PY
      - name: Autogenerate diff is empty (models == applied migration on real Postgres)
        env: { DATABASE_URL: "postgresql+psycopg://dcb:dcb@localhost:5432/dcb" }
        run: |
          python - <<'PY'
          # Stronger than the offline check_migration gate: this runs Alembic's
          # autogenerate against the REAL Postgres schema left by the preceding
          # `alembic upgrade head` and asserts it would emit NO operations. I.e.
          # Base.metadata and the applied migration agree on a full DB round-trip
          # (column types, server defaults, and constraints as the live database
          # actually reflects them) — something the offline DDL-string check cannot
          # see. Needs a real Postgres, so it only runs here in CI.
          import os
          import sys
          from sqlalchemy import create_engine
          from alembic.runtime.migration import MigrationContext
          from alembic.autogenerate import produce_migrations, render_python_code
          from app.db.base import Base
          from app.db.check_models import _load_all_models

          _load_all_models()  # populate Base.metadata (same loader as the other gates)
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              ctx = MigrationContext.configure(
                  conn,
                  opts={"compare_type": True, "compare_server_default": True},
              )
              # Run autogenerate into an in-memory MigrationScript and inspect its ops.
              script = produce_migrations(ctx, Base.metadata)
              upgrade_ops = script.upgrade_ops
              if upgrade_ops.is_empty():
                  print(
                      "PASS: autogenerate produced an empty diff — ORM models match "
                      "the applied migration on real Postgres."
                  )
                  sys.exit(0)
              print("FAIL: autogenerate produced a NON-EMPTY diff against real Postgres.")
              print("The ORM models drifted from migration head; detected operations:")
              try:
                  print(render_python_code(upgrade_ops))
              except Exception:  # rendering is best-effort; the non-empty diff is authoritative
                  for op in upgrade_ops.ops:
                      print("  -", repr(op))
              sys.exit(1)
          PY
      - name: Tests
        env: { DATABASE_URL: "postgresql+psycopg://dcb:dcb@localhost:5432/dcb" }
        run: pytest -q

  docs-gate:
    # The requirements invariant gate keeps running alongside the app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Requirements invariants
        run: bash .softhouse/verify-docs.sh
